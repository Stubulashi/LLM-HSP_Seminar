# IPLE experiment configuration
# Calibration warning (P1-4): scoring.threshold (0.7) is the initial value from ruling C10,
# with no calibration on a healthy subset. Comparing a full long gold prose against a full
# model response by embedding is dominated by generic wording overlap and yields near-noise
# 0/1 scores. Before scaling up, calibrate on a healthy subset, or replace the comparison
# with gold_points multi-reference / LLM judge scoring.
experiment:
  seed_master: 42
  temperature: 0.7
  max_tokens: 512
  repetitions: 3
  annotation_model: qwen7b   # ruling C15: default model for the Annotation Agent (scaf.md L459-468 did not specify one)

scoring:
  # method (choose one): embedding_similarity (cosine, default) / local_judge / api_judge.
  # The judge modes need a judge_fn wired up in the CLI (main.py analyze --scoring-method api_judge);
  # on the manual equivalence subset (64 rows, 58 after dropping empty responses):
  # DeepSeek API judge reached acc=0.966 / kappa=0.733 (target met), so the official judge is
  # api_judge + deepseek; local qwen15b/7b judges are not qualified (kappa<0.35), do not use them.
  method: embedding_similarity   # default cosine; the cloud official analysis uses analyze --scoring-method api_judge
  judge_provider: deepseek      # api_judge reads .env DEEPSEEK_* (see analysis/judge.py)
  threshold: 0.7  # embedding_similarity only; unused in judge mode
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
