# IPLE model configuration (single source of truth for models; pipeline.md L305)
# Repository availability notes (all checked one by one in 2026-09; re-verify on the cloud with scripts/verify_models.py):
#   Local tiers (huggingface): Qwen/Qwen2.5-0.5B-Instruct, Qwen/Qwen2.5-1.5B-Instruct (official, always present)
#   7B tiers (vllm bf16): Qwen/Qwen2.5-7B-Instruct, deepseek-ai/DeepSeek-R1-Distill-Qwen-7B (official, always present)
#   14B/32B tiers (vllm awq): Qwen/Qwen2.5-14B-Instruct-AWQ (official AWQ);
#     DeepSeek-R1-Distill has no official AWQ, so the repository of the AutoAWQ author casperhansen is used
#     (its existence on HF has been confirmed). If it 404s or is rate-limited, switch to a similar AWQ
#     repository such as graelo/DeepSeek-R1-Distill-Qwen-32B-AWQ and update quantization=awq accordingly.
# Field conventions (rulings C4/C14; see docs/decisions.md):
#   architecture: causal_lm (pipeline.md L319-320; optional, defaults to causal_lm)
#   backend: huggingface / api / vllm (scaf.md L783-794 semantics extension; defaults to huggingface;
#             vllm is a backend added for cost optimisation, used to speed up large models, see the AutoDL cost plan)
#   quantization: none / 4bit / 8bit / awq / gptq / fp8.
#             The huggingface backend pairs with bitsandbytes (4bit/8bit); the vllm backend requires
#             pre-quantized weights: awq/gptq/fp8 are read directly by vllm (the models path must point
#             to a repository that contains the corresponding weights).
#   vLLM memory knobs (for a 32G vGPU single-card budget; read by vllm_model.py):
#     gpu_memory_utilization: 0.80~0.95 (lower it on OOM)
#     max_model_len: context limit (lower it under KV pressure, e.g. 4096)
#     max_num_seqs: engine concurrency limit (lower it on OOM)
#     enable_prefix_caching: adjacent steps of one story reuse their shared prefix (default true, to maximise throughput)
#   size / training: needed for the ModelSize statistic and the RQ2 comparison (proj.md L854)
#
# Memory reference points (32G vGPU, e.g. RTX 4090 32G / L40S class):
#   7B bf16   ~14GB weights (runs at util .92; prefix caching has plenty of headroom)
#   14B AWQ   ~9-10GB (the most comfortable, long contexts possible; bf16 would need util>=.95 and max_model_len<=4096, handle with care)
#   32B AWQ   ~18-20GB (the main 32G tier: util .93 with 8K context is feasible)
#   On 24G/48G cards: just adjust gpu_memory_utilization up or down; no code changes are needed.
models:
  qwen05b:   # for real validation on 4GB local VRAM (not a target experiment model on AutoDL)
    family: Qwen
    path: Qwen/Qwen2.5-0.5B-Instruct
    architecture: causal_lm
    backend: huggingface
    size: 0.5B
    training: instruction
    dtype: bfloat16
  qwen15b:   # local 4GB edge candidate (INT4/bitsandbytes; probe first, then decide)
    family: Qwen
    path: Qwen/Qwen2.5-1.5B-Instruct
    architecture: causal_lm
    backend: huggingface
    size: 1.5B
    training: instruction
    quantization: 4bit
  qwen7b:
    family: Qwen
    path: Qwen/Qwen2.5-7B-Instruct
    architecture: causal_lm
    backend: vllm
    size: 7B
    training: instruction
    dtype: bfloat16
    gpu_memory_utilization: 0.92
    max_model_len: 8192
    max_num_seqs: 64
    enable_prefix_caching: true
  qwen14b:   # official AWQ weights (Qwen/Qwen2.5-14B-Instruct-AWQ), comfortable on 32G
    family: Qwen
    path: Qwen/Qwen2.5-14B-Instruct-AWQ
    architecture: causal_lm
    backend: vllm
    size: 14B
    training: instruction
    quantization: awq
    dtype: float16   # AWQ supports float16 only (not bfloat16)
    gpu_memory_utilization: 0.93
    max_model_len: 8192
    max_num_seqs: 48
    enable_prefix_caching: true
  deepseek7b:
    family: DeepSeek
    path: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    architecture: causal_lm
    backend: vllm
    size: 7B
    training: reasoning
    dtype: bfloat16
    gpu_memory_utilization: 0.92
    max_model_len: 8192
    max_num_seqs: 64
    enable_prefix_caching: true
  deepseek14b:  # AWQ weights from the AutoAWQ author casperhansen (vLLM reads the standard quantize_config)
    family: DeepSeek
    path: casperhansen/deepseek-r1-distill-qwen-14b-awq
    architecture: causal_lm
    backend: vllm
    size: 14B
    training: reasoning
    quantization: awq
    dtype: float16   # AWQ supports float16 only
    gpu_memory_utilization: 0.93
    max_model_len: 8192
    max_num_seqs: 48
    enable_prefix_caching: true
  deepseek32b:  # AWQ weights from the AutoAWQ author casperhansen; main 32G tier (on OOM lower max_model_len/num_seqs/util first)
    family: DeepSeek
    path: casperhansen/deepseek-r1-distill-qwen-32b-awq
    architecture: causal_lm
    backend: vllm
    size: 32B
    training: reasoning
    quantization: awq
    dtype: float16   # AWQ supports float16 only
    gpu_memory_utilization: 0.93
    max_model_len: 8192
    max_num_seqs: 32
    enable_prefix_caching: true

  qwen32b:  # optional endpoint D: official Qwen2.5-32B-Instruct AWQ (same scale as deepseek32b, cross-family comparison)
    family: Qwen
    path: Qwen/Qwen2.5-32B-Instruct-AWQ
    architecture: causal_lm
    backend: vllm
    size: 32B
    training: instruction
    quantization: awq
    dtype: float16
    gpu_memory_utilization: 0.93
    max_model_len: 8192
    max_num_seqs: 32
    enable_prefix_caching: true

  # ---- comparison / extension entries below (not part of the official matrix; the paper tables still use the five models above) ----
  # R2: 14B bf16 quantization comparison (to tell whether AWQ introduces artefacts; a tight fit on 32G, small sample only)
  qwen14b_bf16:
    family: Qwen
    path: Qwen/Qwen2.5-14B-Instruct
    architecture: causal_lm
    backend: vllm
    size: 14B
    training: instruction
    dtype: bfloat16
    gpu_memory_utilization: 0.97
    max_model_len: 3072
    max_num_seqs: 8
    enable_prefix_caching: true
  deepseek14b_bf16:
    family: DeepSeek
    path: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
    architecture: causal_lm
    backend: vllm
    size: 14B
    training: reasoning
    dtype: bfloat16
    gpu_memory_utilization: 0.97
    max_model_len: 3072
    max_num_seqs: 8
    enable_prefix_caching: true
  # R3: small-model endpoints under the same protocol (vllm bf16, small enough to run in full)
  qwen05b_vllm:
    family: Qwen
    path: Qwen/Qwen2.5-0.5B-Instruct
    architecture: causal_lm
    backend: vllm
    size: 0.5B
    training: instruction
    dtype: bfloat16
    gpu_memory_utilization: 0.90
    max_model_len: 8192
    max_num_seqs: 64
    enable_prefix_caching: true
  qwen15b_vllm:
    family: Qwen
    path: Qwen/Qwen2.5-1.5B-Instruct
    architecture: causal_lm
    backend: vllm
    size: 1.5B
    training: instruction
    dtype: bfloat16
    gpu_memory_utilization: 0.90
    max_model_len: 8192
    max_num_seqs: 64
    enable_prefix_caching: true
